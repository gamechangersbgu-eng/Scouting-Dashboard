<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סקאוטינג נוער — התאחדות לכדורגל</title>
<link rel="stylesheet" href="/static/leaflet.css">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <header class="brand">
      <div class="brand-row">
        <h1>סקאוטינג נוער</h1>
        <div class="view-tabs" role="tablist" aria-label="תצוגת סרגל הצד">
          <button type="button" class="view-tab" role="tab" id="tab-search"
                  aria-selected="true" aria-controls="search-view">חיפוש</button>
          <button type="button" class="view-tab" role="tab" id="tab-favorites"
                  aria-selected="false" aria-controls="favorites-view">
            <span class="star-mark" aria-hidden="true">★</span> מועדפים
            <span class="count" id="favorites-count"></span>
          </button>
        </div>
      </div>
      <p class="dataset" id="dataset" hidden></p>
    </header>

    <div class="sidebar-view" id="search-view" role="tabpanel" aria-labelledby="tab-search">
    <div class="controls">
      <label class="field search-field">
        <span class="sr-only">חיפוש שחקן</span>
        <input id="query" type="search" placeholder="חיפוש לפי שם, מועדון או מספר שחקן"
               autocomplete="off" spellcheck="false">
      </label>
      <div class="filters">
        <label class="checkbox">
          <input id="above-age" type="checkbox">
          <span>רק שחקנים המשחקים מעל הגיל</span>
        </label>
        <label class="field select-field">
          <span class="sr-only">שנת לידה</span>
          <select id="birth-year">
            <option value="">כל שנות הלידה</option>
          </select>
        </label>
        <label class="field select-field field-wide">
          <span class="sr-only">קבוצה נוכחית</span>
          <select id="current-team">
            <option value="">כל הקבוצות</option>
          </select>
        </label>
        <label class="field select-field">
          <span class="sr-only">ליגה</span>
          <select id="league">
            <option value="">כל הליגות</option>
          </select>
        </label>
      </div>
    </div>

    <p class="results-meta" id="results-meta"></p>
    <ul class="results" id="results"></ul>
    </div>

    <div class="sidebar-view" id="favorites-view" role="tabpanel" aria-labelledby="tab-favorites" hidden>
      <p class="results-meta" id="favorites-meta"></p>
      <ul class="results favorites" id="favorites"></ul>
    </div>
  </aside>

  <main class="main">
    <article class="player" id="player" hidden>
      <header class="player-head">
        <img class="player-photo" id="player-photo" alt="" hidden>
        <div class="player-identity">
          <h2 id="player-name"></h2>
          <dl class="facts" id="player-facts"></dl>
        </div>
        <div class="favorite-box">
          <button type="button" class="star-button" id="favorite-toggle" aria-pressed="false">
            <span class="star-icon" aria-hidden="true">☆</span>
            <span class="star-label">הוספה למועדפים</span>
          </button>
          <div class="favorite-notes" id="favorite-notes" hidden>
            <label for="notes-input">הערות</label>
            <textarea id="notes-input" rows="3" placeholder="מה ראית בשחקן?"></textarea>
            <div class="notes-actions">
              <span class="notes-status" id="notes-status" role="status"></span>
              <button type="button" class="save-button" id="notes-save">שמירה</button>
            </div>
          </div>
        </div>
      </header>

      <section class="panel matches-panel" id="matches-panel" hidden>
        <div class="panel-head">
          <h3>משחקים אחרונים</h3>
          <p class="hint">5 המשחקים האחרונים</p>
        </div>
        <div id="matches-body"></div>
      </section>

      <div class="panels">
        <section class="panel map-panel">
          <div class="panel-head">
            <h3>מסלול הקבוצות</h3>
            <p class="hint">סימון גדול = קבוצה מוקדמת יותר, סימון קטן = עדכנית יותר</p>
          </div>
          <div id="map"></div>
          <div class="map-legend">
            <span><i class="dot dot-early"></i> קבוצה מוקדמת (גדול)</span>
            <span><i class="dot dot-current"></i> קבוצה נוכחית</span>
            <span><i class="dot dot-above"></i> תקופה מעל הגיל</span>
          </div>
          <p class="unlocated" id="unlocated" hidden></p>
        </section>

        <section class="panel seasons-panel">
          <div class="panel-head">
            <h3>עונות</h3>
            <p class="hint">מהעדכנית לראשונה</p>
          </div>
          <div class="table-scroll">
            <table class="seasons">
              <thead>
                <tr>
                  <th>עונה</th><th>קבוצה</th><th>קב׳ גיל</th>
                  <th>מש׳</th><th>שערים</th><th>כרטיסים</th>
                </tr>
              </thead>
              <tbody id="seasons-body"></tbody>
            </table>
          </div>
        </section>
      </div>

      <p class="tiles-caption" id="tiles-caption"></p>
      <section class="tiles" id="tiles"></section>
    </article>
  </main>
</div>

<script src="/static/league-filter.js"></script>
<script src="/static/leaflet.js"></script>
<script src="/static/app.js?v=header-facts-v2"></script>
</body>
</html>
